server {
    listen 8000 default_server;
    server_name _;
    # 1. Health check endpoint (intercepts before the redirect)
    location = /healthz {
        default_type text/plain;
        return 200 "healthy\n";
    }

    # 2. Catch-all redirect for everything else
    location / {
        return 301 https://wevote.us$request_uri;
    }
}

server {
    listen 8000;
    server_name wevote.us quality.wevote.us;

    # set the real ip from headers from ALB
    set_real_ip_from    172.16.0.0/12;
    set_real_ip_from    10.0.0.0/8;
    set_real_ip_from    192.168.0.0/16;
    real_ip_header      proxy_protocol;
    charset             utf-8;

    gzip on;
    gzip_types application/javascript application/x-javascript text/css text/plain;

    # Redirect index.html to the root domain
    if ($request_uri ~* "^/index\.html$") {
        return 301 https://$host/;
    }

    root /usr/share/nginx/html;
    index index.html;

    # 1. Standard HTML Router Entrypoint & Fallback Route
    location / {
        # Group your dynamic layout file under an explicit cache key tag
        add_header Surrogate-Key "wv-app-shell";
        # Fastly caches index.html for 1 year, revalidating dynamically via API purge
        add_header Surrogate-Control "max-age=31536000, stale-while-revalidate=3600";
        # Browsers never cache index.html, forcing them to always check the Fastly edge
        add_header Cache-Control "no-cache, no-store, must-revalidate";

        try_files $uri $uri/ /index.html;
    }

    # 2. Immutable Static Assets (JS, CSS, Images, Fonts)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff2?)$ {
        # Long-term cache on both Fastly and local browsers due to unique build hashes
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # To allow POST on static pages
    error_page 405 =200 $uri;
}
