version: 0.2

env:
  shell: bash
phases:
  build:
    on-failure: ABORT
    commands:
      - echo "Purging Fastly Cache"
      - |
        curl -i -X POST \
          -H "Fastly-Key: $FASTLY_API_KEY" \
          -H "Fastly-Soft-Purge: 1" \
          -H "Accept: application/json" \
          https://api.fastly.com/service/$FASTLY_SERVICE_ID/purge/wv-app-shell
